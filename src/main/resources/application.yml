spring:
  application:
    name: local-assistant
  main:
    web-application-type: none
  ai:
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      init:
        pull-model-strategy: when_missing
      chat:
        options:
          model: ${CHAT_MODEL:llama3.1:8b}   # lighter option: llama3.2:3b
          temperature: 0.1
      embedding:
        model: nomic-embed-text

rag:
  document-path: ${RAG_DOCUMENT:file:./documents/book.txt}
  system-prompt: >-
    You are a helpful assistant. You answer questions about the provided
    material (a book or a software project) using only that material.
  chunk-size: 400      # approximate tokens per chunk
  top-k: 5             # chunks sent to the model per question
  similarity-threshold: 0.0
  workspace-root: indexes      # saved indexes: indexes/<project-or-book>-<id>/ (next to where you run the app)
  store-in-project: false      # false = the indexed project is never written to; true = save in <project>/.local-assistant
  index-tests: false     # also index src/test (slower, rarely useful for understanding a project)
  embed-parallelism: 3   # embedding requests sent to the local model at the same time
  quick-index: false     # true = Java files as summaries only: about 3x faster, but less detail in answers

logging:
  level:
    org.springframework.ai.transformer.splitter.TextSplitter: WARN   # one line per file is too noisy
    org.springframework.ai.vectorstore.SimpleVectorStore: WARN      # logs one line per chunk while embedding
    io.netty.resolver.dns: OFF                                       # harmless macOS DNS warning
